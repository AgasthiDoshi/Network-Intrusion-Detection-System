name: Java demo verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build on Linux
        if: runner.os != 'Windows'
        run: sh build.sh
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1
      - name: Run regression suite
        run: java '-Djava.awt.headless=true' -jar build/nids-demo.jar test
      - name: Evaluate bundled synthetic files
        run: java -jar build/nids-demo.jar evaluate --train data/train.csv --input data/test.csv
      - name: Render Swing dashboard
        run: java '-Djava.awt.headless=true' -jar build/nids-demo.jar screenshot
      - uses: actions/upload-artifact@v4
        with:
          name: nids-demo-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            build/nids-demo.jar
            output/
